<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de Scraping</title>
    <!-- Importer Tailwind CSS via Play CDN -->
    <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('aa.png'); /* Chemin relatif sans guillemets */
            background-size: cover; /* Assurer que l'image couvre tout l'écran */
            background-position: center; /* Centrer l'image */
            background-repeat: no-repeat; /* Éviter la répétition de l'image */
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen m-0">
    <div class="bg-white p-6 rounded-lg shadow-md w-[300px]"> <!-- Largeur conservée -->
        <h2 class="text-xl font-semibold text-gray-800 text-center mb-4">Formulaire de Scraping</h2>
        <form action="/submit" method="post">
            <div class="mb-4">
                <label for="destination" class="block text-sm font-medium text-gray-700">Destination:</label>
                <input type="text" id="destination" name="destination" placeholder="Entrez la destination" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div class="mb-4">
                <label for="check-in" class="block text-sm font-medium text-gray-700">Check-in:</label>
                <input type="text" id="check-in" name="check-in" placeholder="Check-in" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div class="mb-4">
                <label for="check-out" class="block text-sm font-medium text-gray-700">Check-out:</label>
                <input type="text" id="check-out" name="check-out" placeholder="Check-out" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div class="mb-4">
                <label for="site-link" class="block text-sm font-medium text-gray-700">Lien du site à scraper:</label>
                <input type="url" id="site-link" name="site-link" placeholder="Entrez l'URL du site" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div>
                <button type="submit" class="w-full px-4 py-2 bg-green-500 text-white rounded-md shadow-sm hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 text-lg">Soumettre</button>
            </div>
        </form>
    </div>
</body>
</html>
